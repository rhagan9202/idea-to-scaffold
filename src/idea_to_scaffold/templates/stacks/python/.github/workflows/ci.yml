name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-python puts python and pip on PATH, so a setup command that runs pip installs into this Python
      # rather than the runner's externally managed system Python (PEP 668)
      - uses: actions/setup-python@v5
        with:
          python-version: "${runtime}"
      - uses: astral-sh/setup-uv@v5
      # its:commands (generated from package.yaml by `its link`; edit package.yaml, not these steps)
      - run: ${cmd_setup}
      - run: ${cmd_lint}
      - run: ${cmd_test}
      # /its:commands
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # its drift compares each done item's files with the commit it was verified at
      - uses: astral-sh/setup-uv@v5
      - run: uvx --from "${its_source}" its validate .
      - run: uvx --from "${its_source}" its link --check .
      - run: uvx --from "${its_source}" its drift --check .
      # lists Must acceptance criteria that no test names; delete continue-on-error once every one has a test
      - run: uvx --from "${its_source}" its validate . --trace
        continue-on-error: true
  gate:
    # The done gate on the pull request, with the target branch's rules: scope and tamper checks, the item's Verify,
    # test, lint, its held-out tests and red on parent. With land, this is the one gate every surface meets,
    # including agents that never run its (a vendor's cloud agent opening a pull request).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # its gate compares the pull request with the branch it targets
      - uses: actions/setup-python@v5
        with:
          python-version: "${runtime}"
      - uses: astral-sh/setup-uv@v5
      - run: uvx --from "${its_source}" its gate HEAD .
