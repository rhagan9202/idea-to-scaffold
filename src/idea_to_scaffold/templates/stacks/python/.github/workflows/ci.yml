name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${runtime}
      - run: ${cmd_setup}
      - run: ${cmd_lint}
      - run: ${cmd_test}
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx --from "${its_source}" its validate .
      - run: uvx --from "${its_source}" its link --check .
