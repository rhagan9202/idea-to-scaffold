spec_version: "0.1"

project:
  name: "<Project Name>"
  slug: "<project-slug>"
  summary: "<One sentence: what it does and for whom.>"
  license: "MIT"

stack:
  language: "python"
  runtime: "3.12"
  framework: ""
  package_manager: "uv"
  test: "pytest"
  lint: "ruff"

agents: [codex, claude, copilot, cursor]

commands:
  setup: "uv sync"
  test: "uv run pytest"
  lint: "uv run ruff check ."
  run: ""

artifacts:
  planning/00-idea.md: draft
  planning/01-vision.md: draft
  planning/02-features.md: draft
  planning/03-requirements.md: draft
  planning/04-architecture.md: draft
  planning/05-design.md: draft
  planning/06-project-plan.md: draft
  planning/07-backlog.md: draft

first_task: ""   # optional; defaults to the first ready item (a `todo` whose dependencies are `done`)
